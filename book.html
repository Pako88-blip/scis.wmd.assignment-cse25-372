<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Book Appointment - Kgomo Care Livestock Veterinary Clinic
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">

            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand d-flex align-items-center" href="index.html">

                    <img src="logo.png.jpeg"
                        alt="Kgomo Care"
                        width="50"
                        class="me-2">

                    <span>
                        Kgomo <b>Care+</b>
                    </span>

                </a>

                <!-- Mobile Toggle -->
                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navigation Links -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">
                                About
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="services.html">
                                Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="health.html">
                                Health Tips
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="shop.html">
                                Shop
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="book.html">
                                Book
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">
                                Contact
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

     <!-- HERO -->
    <section class="hero">

        <img src="services.hero.v2.png"
            alt="Livestock Health"
            class="img-fluid w-100">

    </section>

    <!-- BOOKING FORM -->
    <section class="section py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="card shadow-sm border-0 p-4">

                        <h2 class="text-center mb-4">
                            Book an Appointment
                        </h2>

                        <form onsubmit="return bookAppointment()">

                            <!-- Name -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>

                            <!-- Phone -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter your phone number"
                                    required>

                            </div>

                            <!-- Animal Type -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Animal Type
                                </label>

                                <select class="form-select" required>

                                    <option selected disabled>
                                        Select animal type
                                    </option>

                                    <option>Cattle</option>
                                    <option>Goats</option>
                                    <option>Sheep</option>
                                    <option>Poultry</option>
                                    <option>Other</option>

                                </select>

                            </div>

                            <!-- Service -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Service Needed
                                </label>

                                <select class="form-select" required>

                                    <option selected disabled>
                                        Select service
                                    </option>

                                    <option>Farm Visit</option>
                                    <option>Vaccination</option>
                                    <option>Disease Diagnosis</option>
                                    <option>Emergency Treatment</option>

                                </select>

                            </div>

                            <!-- Date -->
                            <div class="mb-4">

                                <label class="form-label">
                                    Appointment Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    required>

                            </div>

                            <!-- Submit Button -->
                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                <i class="bi bi-calendar-check me-2"></i>

                                Book Now

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- CTA -->
    <section class="cta bg-success text-white text-center py-5">

        <div class="container">

            <h3 class="mb-3">
                Professional Veterinary Care For Your Livestock
            </h3>

            <p>
                Reliable support for farmers across Botswana.
            </p>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            &copy; 2026 Kgomo Care Livestock Veterinary Clinic
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>

</html>
